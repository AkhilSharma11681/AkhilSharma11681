<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="100%">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>

    <!-- Subtle atmospheric ambient glow from center (like the soft camera blur in Blitsum) -->
    <radialGradient id="ambientCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>
  
  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", "Segoe UI", Roboto, sans-serif;
    }
    .font-mono {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", sans-serif;
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    .text-mono-subtle {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      fill: #737373;
    }
    .pulse-green {
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>


  <!-- Canvas -->
  <rect width="900" height="150" fill="url(#bgGrad)"/>
  <ellipse cx="450" cy="75" rx="430" ry="70" fill="url(#ambientCenter)"/>

  <!-- Border Box -->
  <rect x="20" y="14" width="860" height="122" rx="8" fill="#080808" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Top Bar -->
  <g transform="translate(20, 14)">
    <rect width="860" height="30" rx="8" fill="#0d0d0d"/>
    <line x1="0" y1="30" x2="860" y2="30" stroke="#1f1f1f" stroke-width="1"/>
    <text x="24" y="19" class="text-mono-subtle">CODEBASE COMPOSITION // VERIFIED GITHUB DATA</text>
    <text x="836" y="19" class="text-mono-subtle" text-anchor="end">26 REPOSITORIES</text>
  </g>

  <!-- Hairline Progress Track (Total width 816) -->
  <g transform="translate(42, 64)">
    <!-- Track background -->
    <rect width="816" height="8" rx="4" fill="#141414"/>

    <!-- TS (42%) = 342 -->
    <rect x="0" y="0" width="342" height="8" rx="4" fill="#ffffff"/>
    <!-- JS (32%) = 261 -->
    <rect x="344" y="0" width="261" height="8" rx="4" fill="#a3a3a3"/>
    <!-- Py (14%) = 114 -->
    <rect x="607" y="0" width="114" height="8" rx="4" fill="#737373"/>
    <!-- Rust (7%) = 57 -->
    <rect x="723" y="0" width="57" height="8" rx="4" fill="#525252"/>
    <!-- Other (5%) = 34 -->
    <rect x="782" y="0" width="34" height="8" rx="4" fill="#333333"/>
  </g>

  <!-- Legend -->
  <g transform="translate(42, 104)" class="font-mono" font-size="11.5">
    <!-- TS -->
    <circle cx="4" cy="-4" r="3.5" fill="#ffffff"/>
    <text x="14" y="0" fill="#ededed">TypeScript <tspan fill="#737373">42%</tspan></text>

    <!-- JS -->
    <circle cx="194" cy="-4" r="3.5" fill="#a3a3a3"/>
    <text x="204" y="0" fill="#ededed">JavaScript <tspan fill="#737373">32%</tspan></text>

    <!-- Py -->
    <circle cx="374" cy="-4" r="3.5" fill="#737373"/>
    <text x="384" y="0" fill="#ededed">Python <tspan fill="#737373">14%</tspan></text>

    <!-- Rust -->
    <circle cx="544" cy="-4" r="3.5" fill="#525252"/>
    <text x="554" y="0" fill="#ededed">Rust &amp; Systems <tspan fill="#737373">7%</tspan></text>

    <!-- Other -->
    <circle cx="714" cy="-4" r="3.5" fill="#333333"/>
    <text x="724" y="0" fill="#ededed">Web / Other <tspan fill="#737373">5%</tspan></text>
  </g>
</svg>