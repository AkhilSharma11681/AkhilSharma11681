<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%" height="100%">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>

    <radialGradient id="ambientCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>
  
  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", "Segoe UI", Roboto, sans-serif;
    }
    .font-mono {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", sans-serif;
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    .text-mono-subtle {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      fill: #737373;
    }
  </style>


  <!-- Canvas -->
  <rect width="900" height="370" fill="url(#bgGrad)"/>
  <ellipse cx="450" cy="180" rx="420" ry="170" fill="url(#ambientCenter)"/>

  <!-- Minimal Hairline Grid Borders -->
  <line x1="30" y1="20" x2="870" y2="20" stroke="#171717" stroke-width="1"/>
  <line x1="30" y1="350" x2="870" y2="350" stroke="#171717" stroke-width="1"/>

  <!-- Main Statement Heading -->
  <g transform="translate(450, 78)">
    <text x="0" y="0" fill="#ededed" font-size="34" text-anchor="middle" class="text-title">
      Understand the problem. Keep shipping.
    </text>
  </g>

  <!-- Central Console Box (Exact Blitsum Structure) -->
  <g transform="translate(160, 112)">
    <rect width="580" height="136" rx="8" fill="#090909" stroke="#222222" stroke-width="1"/>

    <text x="24" y="26" class="text-mono-subtle">TERMINAL // IDENTITY</text>
    <text x="556" y="26" class="text-mono-subtle" text-anchor="end">AKHIL.SYS · ACTIVE</text>

    <!-- Input Field -->
    <g transform="translate(24, 40)">
      <rect width="370" height="48" rx="6" fill="#050505" stroke="#1c1c1c" stroke-width="1"/>
      <text x="16" y="29" fill="#737373" font-size="12.5" class="font-mono">
        akhil@github:~$ <tspan fill="#e5e5e5">whoami --focus=systems</tspan> <tspan fill="#22c55e" font-weight="700">|</tspan>
      </text>

      <!-- Action Button -->
      <g transform="translate(382, 0)">
        <rect width="150" height="48" rx="6" fill="#141414" stroke="#262626" stroke-width="1"/>
        <text x="75" y="29" fill="#d4d4d4" font-size="11.5" font-weight="600" text-anchor="middle" class="font-mono" letter-spacing="0.1em">
          EXPLORE WORK
        </text>
      </g>
    </g>

    <!-- Bottom Status Line inside Box -->
    <g transform="translate(24, 116)">
      <circle cx="4" cy="-4" r="3.5" fill="#22c55e" filter="url(#softGlowGreen)"/>
      <text x="16" y="0" fill="#a3a3a3" font-size="10.5" class="font-mono" letter-spacing="0.08em">
        STATUS · ACTIVE <tspan fill="#525252">·</tspan> FULL-STACK <tspan fill="#525252">·</tspan> TYPESCRIPT <tspan fill="#525252">·</tspan> NEXT.JS <tspan fill="#525252">·</tspan> PYTHON
      </text>
    </g>
  </g>

  <!-- Sub-caption -->
  <g transform="translate(450, 285)">
    <text x="0" y="0" fill="#737373" font-size="12.5" text-anchor="middle" class="font-sans">
      Full-stack developer &amp; product builder. Turning complex problem spaces into refined, reliable software.
    </text>
    <text x="0" y="24" fill="#525252" font-size="10.5" text-anchor="middle" class="font-mono" letter-spacing="0.15em">
      HUMAN-CENTERED BY DEFAULT · TYPE-SAFE ARCHITECTURE · MEASURED ITERATION
    </text>
  </g>
</svg>