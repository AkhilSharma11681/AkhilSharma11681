<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="100%">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>

    <!-- Subtle atmospheric ambient glow from center (like the soft camera blur in Blitsum) -->
    <radialGradient id="ambientCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>
  
  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", "Segoe UI", Roboto, sans-serif;
    }
    .font-mono {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", sans-serif;
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    .text-mono-subtle {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      fill: #737373;
    }
    .pulse-green {
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>


  <!-- Canvas -->
  <rect width="900" height="190" fill="url(#bgGrad)"/>
  <ellipse cx="450" cy="95" rx="430" ry="90" fill="url(#ambientCenter)"/>

  <!-- Border Box -->
  <rect x="20" y="16" width="860" height="158" rx="8" fill="#080808" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Top Bar -->
  <g transform="translate(20, 16)">
    <rect width="860" height="34" rx="8" fill="#0d0d0d"/>
    <line x1="0" y1="34" x2="860" y2="34" stroke="#1f1f1f" stroke-width="1"/>
    <text x="24" y="21" class="text-mono-subtle">TELEMETRY // VERIFIED METRICS</text>
    <text x="836" y="21" class="text-mono-subtle" text-anchor="end">SYSTEM HEALTH: OPTIMAL</text>
  </g>

  <!-- 4 Blocks -->
  <g transform="translate(20, 50)">
    <!-- Metric 1 -->
    <g transform="translate(24, 24)">
      <text x="0" y="0" class="text-mono-subtle">PUBLIC REPOSITORIES</text>
      <text x="0" y="40" fill="#ffffff" font-size="34" font-weight="600" class="font-sans">26</text>
      <circle cx="4" cy="62" r="3" fill="#22c55e" filter="url(#softGlowGreen)"/>
      <text x="14" y="66" fill="#737373" font-size="11" class="font-mono">active source tree</text>
    </g>

    <!-- Divider 1 -->
    <line x1="225" y1="16" x2="225" y2="96" stroke="#171717" stroke-width="1"/>

    <!-- Metric 2 -->
    <g transform="translate(249, 24)">
      <text x="0" y="0" class="text-mono-subtle">CORE ECOSYSTEM</text>
      <text x="0" y="34" fill="#ffffff" font-size="16" font-weight="600" class="font-sans">TypeScript · Py</text>
      <text x="0" y="54" fill="#8a8a8a" font-size="12" class="font-sans">React &amp; Next.js</text>
      <circle cx="4" cy="68" r="3" fill="#22c55e" filter="url(#softGlowGreen)"/>
      <text x="14" y="72" fill="#737373" font-size="11" class="font-mono">typed runtime</text>
    </g>

    <!-- Divider 2 -->
    <line x1="440" y1="16" x2="440" y2="96" stroke="#171717" stroke-width="1"/>

    <!-- Metric 3 -->
    <g transform="translate(464, 24)">
      <text x="0" y="0" class="text-mono-subtle">COLLABORATION</text>
      <text x="0" y="34" fill="#ffffff" font-size="16" font-weight="600" class="font-sans">Org &amp; Solo</text>
      <text x="0" y="54" fill="#8a8a8a" font-size="12" class="font-sans">Miloo-Chat · ps-ys</text>
      <circle cx="4" cy="68" r="3" fill="#fbbf24" filter="url(#softGlowAmber)"/>
      <text x="14" y="72" fill="#737373" font-size="11" class="font-mono">distributed git</text>
    </g>

    <!-- Divider 3 -->
    <line x1="655" y1="16" x2="655" y2="96" stroke="#171717" stroke-width="1"/>

    <!-- Metric 4 -->
    <g transform="translate(679, 24)">
      <text x="0" y="0" class="text-mono-subtle">PARADIGM</text>
      <text x="0" y="34" fill="#ffffff" font-size="16" font-weight="600" class="font-sans">Ship &amp; Iterate</text>
      <text x="0" y="54" fill="#8a8a8a" font-size="12" class="font-sans">Reliability first</text>
      <circle cx="4" cy="68" r="3" fill="#22c55e" filter="url(#softGlowGreen)"/>
      <text x="14" y="72" fill="#737373" font-size="11" class="font-mono">problem-focused</text>
    </g>
  </g>
</svg>