<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="100%">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>

    <!-- Subtle atmospheric ambient glow from center (like the soft camera blur in Blitsum) -->
    <radialGradient id="ambientCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>
  
  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", "Segoe UI", Roboto, sans-serif;
    }
    .font-mono {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", sans-serif;
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    .text-mono-subtle {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      fill: #737373;
    }
    .pulse-green {
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>


  <!-- Canvas -->
  <rect width="900" height="270" fill="url(#bgGrad)"/>
  <ellipse cx="450" cy="135" rx="430" ry="120" fill="url(#ambientCenter)"/>

  <!-- Border Box -->
  <rect x="20" y="16" width="860" height="238" rx="8" fill="#080808" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Top Bar -->
  <g transform="translate(20, 16)">
    <rect width="860" height="34" rx="8" fill="#0d0d0d"/>
    <line x1="0" y1="34" x2="860" y2="34" stroke="#1f1f1f" stroke-width="1"/>
    <text x="24" y="21" class="text-mono-subtle">RUNTIME INVENTORY // ARCHITECTURE STACK</text>
    <text x="836" y="21" class="text-mono-subtle" text-anchor="end">4 CORE DOMAINS</text>
  </g>

  <!-- 4 Columns (Blitsum Footer Style) -->
  <!-- Col 1 -->
  <g transform="translate(48, 76)">
    <text x="0" y="0" class="text-mono-subtle">LANGUAGES</text>
    <line x1="0" y1="10" x2="160" y2="10" stroke="#1f1f1f" stroke-width="1"/>
    <g transform="translate(0, 32)" class="font-mono" font-size="12" fill="#d4d4d4">
      <text x="0" y="0">TypeScript</text>
      <text x="0" y="24">JavaScript (ESNext)</text>
      <text x="0" y="48">Python</text>
      <text x="0" y="72">SQL</text>
      <text x="0" y="96">HTML5 &amp; Modern CSS</text>
    </g>
  </g>

  <!-- Col 2 -->
  <g transform="translate(262, 76)">
    <text x="0" y="0" class="text-mono-subtle">FRONTEND &amp; UI</text>
    <line x1="0" y1="10" x2="160" y2="10" stroke="#1f1f1f" stroke-width="1"/>
    <g transform="translate(0, 32)" class="font-mono" font-size="12" fill="#d4d4d4">
      <text x="0" y="0">Next.js 15 (App Router)</text>
      <text x="0" y="24">React 19</text>
      <text x="0" y="48">Tailwind CSS</text>
      <text x="0" y="72">Vite</text>
      <text x="0" y="96">Component Systems</text>
    </g>
  </g>

  <!-- Col 3 -->
  <g transform="translate(476, 76)">
    <text x="0" y="0" class="text-mono-subtle">BACKEND &amp; DATA</text>
    <line x1="0" y1="10" x2="160" y2="10" stroke="#1f1f1f" stroke-width="1"/>
    <g transform="translate(0, 32)" class="font-mono" font-size="12" fill="#d4d4d4">
      <text x="0" y="0">Node.js &amp; Express</text>
      <text x="0" y="24">PostgreSQL</text>
      <text x="0" y="48">Prisma ORM</text>
      <text x="0" y="72">Tableau</text>
      <text x="0" y="96">Pandas &amp; EDA</text>
    </g>
  </g>

  <!-- Col 4 -->
  <g transform="translate(690, 76)">
    <text x="0" y="0" class="text-mono-subtle">WORKFLOW &amp; CLOUD</text>
    <line x1="0" y1="10" x2="150" y2="10" stroke="#1f1f1f" stroke-width="1"/>
    <g transform="translate(0, 32)" class="font-mono" font-size="12" fill="#d4d4d4">
      <text x="0" y="0">Git &amp; GitHub</text>
      <text x="0" y="24">Docker</text>
      <text x="0" y="48">Postman</text>
      <text x="0" y="72">Figma</text>
      <text x="0" y="96">Vercel &amp; Render</text>
    </g>
  </g>
</svg>