<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>

    <radialGradient id="ambientCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>
  
  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", "Segoe UI", Roboto, sans-serif;
    }
    .font-mono {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", sans-serif;
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    .text-mono-subtle {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      fill: #737373;
    }
  </style>


  <!-- Canvas -->
  <rect width="900" height="130" fill="url(#bgGrad)"/>
  <ellipse cx="450" cy="65" rx="430" ry="60" fill="url(#ambientCenter)"/>

  <!-- Border Box -->
  <rect x="20" y="12" width="860" height="106" rx="8" fill="#080808" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Top Bar -->
  <g transform="translate(20, 12)">
    <rect width="860" height="28" rx="8" fill="#0d0d0d"/>
    <line x1="0" y1="28" x2="860" y2="28" stroke="#1f1f1f" stroke-width="1"/>
    <text x="24" y="18" class="text-mono-subtle">CONTRIBUTION TELEMETRY // VERIFIED COMMIT CADENCE</text>
    <text x="836" y="18" class="text-mono-subtle" text-anchor="end">STATUS: CONTINUOUS</text>
  </g>

  <!-- 3 Telemetry Columns -->
  <!-- Col 1: Total Contributions -->
  <g transform="translate(68, 52)">
    <text x="0" y="0" class="text-mono-subtle">TOTAL CONTRIBUTIONS</text>
    <text x="0" y="32" fill="#ffffff" font-size="28" font-weight="600" class="font-sans">600+</text>
    <text x="0" y="48" fill="#737373" font-size="11" class="font-mono">Dec 2024 — Present</text>
  </g>

  <!-- Divider 1 -->
  <line x1="330" y1="46" x2="330" y2="108" stroke="#171717" stroke-width="1"/>

  <!-- Col 2: Active Streak -->
  <g transform="translate(378, 52)">
    <text x="0" y="0" class="text-mono-subtle">ENGINEERING CADENCE</text>
    <g transform="translate(0, 32)">
      <circle cx="6" cy="-8" r="4.5" fill="#22c55e" filter="url(#softGlowGreen)"/>
      <text x="20" y="0" fill="#22c55e" font-size="24" font-weight="600" class="font-mono">ACTIVE</text>
    </g>
    <text x="0" y="48" fill="#737373" font-size="11" class="font-mono">Continuous learning &amp; builds</text>
  </g>

  <!-- Divider 2 -->
  <line x1="630" y1="46" x2="630" y2="108" stroke="#171717" stroke-width="1"/>

  <!-- Col 3: Focus -->
  <g transform="translate(678, 52)">
    <text x="0" y="0" class="text-mono-subtle">DISCIPLINE</text>
    <text x="0" y="32" fill="#ffffff" font-size="24" font-weight="600" class="font-sans">Ship &amp; Iterate</text>
    <text x="0" y="48" fill="#737373" font-size="11" class="font-mono">Type safety &amp; clarity</text>
  </g>
</svg>