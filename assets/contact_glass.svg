<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="100%" height="100%">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>

    <!-- Subtle atmospheric ambient glow from center (like the soft camera blur in Blitsum) -->
    <radialGradient id="ambientCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>
  
  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", "Segoe UI", Roboto, sans-serif;
    }
    .font-mono {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Geist", sans-serif;
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    .text-mono-subtle {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      fill: #737373;
    }
    .pulse-green {
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>


  <!-- Canvas -->
  <rect width="900" height="140" fill="url(#bgGrad)"/>
  <ellipse cx="450" cy="70" rx="430" ry="65" fill="url(#ambientCenter)"/>

  <!-- Border Box -->
  <rect x="20" y="14" width="860" height="112" rx="8" fill="#080808" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Content -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" class="text-mono-subtle">CONNECTION // DIALOGUE</text>
    <text x="0" y="28" fill="#ffffff" font-size="20" class="text-title">
      Let's collaborate on ambitious software.
    </text>
    <text x="0" y="50" fill="#8a8a8a" font-size="12" class="font-sans">
      Open for engineering discussions, software products, and open-source contributions.
    </text>
  </g>

  <!-- Action Badges (Blitsum Start Engine Style) -->
  <g transform="translate(630, 44)">
    <!-- Email Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="34" rx="6" fill="#121212" stroke="#262626" stroke-width="1"/>
      <text x="105" y="21" fill="#e5e5e5" font-size="11" font-weight="500" text-anchor="middle" class="font-mono">
        ✉ akhil.sharma.techie
      </text>
    </g>
    <!-- Repos Pill -->
    <g transform="translate(0, 42)">
      <rect width="210" height="34" rx="6" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
      <text x="105" y="21" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">
        EXPLORE CODEBASE ↗
      </text>
    </g>
  </g>
</svg>