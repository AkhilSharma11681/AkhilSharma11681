<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="100%" height="100%">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a11"/>
      <stop offset="50%" stop-color="#0d111e"/>
      <stop offset="100%" stop-color="#06070c"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="30%" stop-color="#93c5fd" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="cyanVioletPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="cyanVioletBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.35"/>
    </linearGradient>

    <radialGradient id="cardGlowViolet" cx="15%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cardGlowCyan" cx="85%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

  </defs>
  
  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace;
    }
  </style>


  <!-- Card Background -->
  <rect width="440" height="210" rx="14" fill="url(#bgGrad)"/>
  <circle cx="80" cy="50" r="120" fill="url(#cardGlowViolet)"/>
  <circle cx="360" cy="160" r="140" fill="url(#cardGlowCyan)"/>

  <!-- Liquid Glass Panel -->
  <g filter="url(#cardShadow)">
    <rect x="12" y="10" width="416" height="190" rx="12" fill="url(#glassGrad)"/>
    <rect x="12" y="10" width="416" height="190" rx="12" fill="none" stroke="url(#glassBorder)" stroke-width="1.1"/>
    <!-- Specular Bevel Line -->
    <path d="M 24 11 L 416 11" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Top Metadata Header -->
  <g transform="translate(28, 32)">
    <!-- Index Badge -->
    <rect x="0" y="0" width="32" height="18" rx="4" fill="url(#cyanVioletPill)" stroke="url(#cyanVioletBorder)" stroke-width="0.8"/>
    <text x="16" y="13" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">02</text>

    <!-- Category -->
    <text x="42" y="13" fill="#94a3b8" font-size="11" font-weight="600" class="font-sans" letter-spacing="0.5">CORE SYSTEMS</text>

    <!-- Branch Indicator -->
    <g transform="translate(330, 2)">
      <circle cx="4" cy="5" r="3" fill="#818cf8"/>
      <path d="M 4 8 L 4 13 A 3 3 0 0 0 7 16 L 14 16" fill="none" stroke="#64748b" stroke-width="1"/>
      <circle cx="16" cy="16" r="2.5" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Project Title -->
  <g transform="translate(28, 76)">
    <text x="0" y="0" fill="url(#titleGrad)" font-size="20" font-weight="700" class="font-sans" letter-spacing="-0.3">
      RUCSYS
    </text>
  </g>

  <!-- Description -->
  <g transform="translate(28, 98)" fill="#94a3b8" font-size="12" class="font-sans">
    <text x="0" y="0">Structured application system in the primary portfolio,</text>
    <text x="0" y="17">emphasizing type-safety, clean logic, and scalability.</text>
  </g>

  <!-- Tech Stack Tags -->
  <g transform="translate(28, 138)">
    
        <g transform="translate(0, 0)">
          <rect width="95.0" height="22" rx="6" fill="#0f172a" fill-opacity="0.65" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="0.8"/>
          <text x="47.5" y="14.5" fill="#bae6fd" font-size="10.5" font-weight="500" text-anchor="middle" class="font-mono">TypeScript</text>
        </g>
        <g transform="translate(103.0, 0)">
          <rect width="72.5" height="22" rx="6" fill="#0f172a" fill-opacity="0.65" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="0.8"/>
          <text x="36.25" y="14.5" fill="#bae6fd" font-size="10.5" font-weight="500" text-anchor="middle" class="font-mono">Node.js</text>
        </g>
        <g transform="translate(183.5, 0)">
          <rect width="110.0" height="22" rx="6" fill="#0f172a" fill-opacity="0.65" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="0.8"/>
          <text x="55.0" y="14.5" fill="#bae6fd" font-size="10.5" font-weight="500" text-anchor="middle" class="font-mono">Architecture</text>
        </g>
  </g>

  <!-- Bottom Action Bar -->
  <g transform="translate(28, 180)">
    <line x1="0" y1="-8" x2="384" y2="-8" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <text x="0" y="6" fill="#64748b" font-size="10.5" class="font-mono">github.com/AkhilSharma11681/RUCSYS</text>
    <text x="384" y="6" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="end" class="font-mono">Explore →</text>
  </g>
</svg>